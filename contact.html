<main class="page-main-narrow">
  <section class="card fade-in">
    <h1 class="section-title" data-ja="お問い合わせ" data-en="Contact">お問い合わせ</h1>
    <div class="policy-body">
      <p data-ja="バグの報告・ご要望・対応ゲームの追加リクエストなどはこちらからお送りください。" data-en="Please use this form for bug reports, feature requests, or game addition requests.">バグの報告・ご要望・対応ゲームの追加リクエストなどはこちらからお送りください。</p>
      <form class="contact-form" action="https://formspree.io/f/xaqkznby" method="POST">
        <div class="form-group">
          <label class="form-label" for="contactName" data-ja="お名前" data-en="Name">お名前</label>
          <input type="text" id="contactName" name="name" placeholder="例: 田中太郎" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="contactEmail" data-ja="メールアドレス" data-en="Email">メールアドレス</label>
          <input type="email" id="contactEmail" name="email" placeholder="例: example@email.com" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="contactMsg" data-ja="メッセージ" data-en="Message">メッセージ</label>
          <textarea id="contactMsg" name="message" rows="6" placeholder="お問い合わせ内容をご記入ください" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary" data-ja="送信する" data-en="Send">送信する</button>
      </form>
      <p class="policy-date" style="margin-top:16px;" data-ja="※ フォームはFormspreeを利用しています。" data-en="※ This form uses Formspree.">※ フォームはFormspreeを利用しています。</p>
    </div>
  </section>
