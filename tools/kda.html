  <section class="card fade-in" style="margin-bottom:24px;">
    <h1 class="section-title" data-ja="💀 KDA計算機" data-en="💀 KDA Calculator">💀 KDA計算機</h1>
    <p class="section-desc" data-ja="KDA = (キル + アシスト) ÷ デス。デスが0の場合はキル+アシストをそのまま表示します。" data-en="KDA = (Kills + Assists) ÷ Deaths. If deaths = 0, shows Kills + Assists directly.">KDA = (キル + アシスト) ÷ デス。デスが0の場合はキル+アシストをそのまま表示します。</p>

    <div class="form-grid-3" style="margin-bottom:20px;">
      <div class="form-group">
        <label class="form-label" for="kills" data-ja="キル数" data-en="Kills">キル数</label>
        <input type="number" id="kills" placeholder="0" min="0" step="1" />
      </div>
      <div class="form-group">
        <label class="form-label" for="deaths" data-ja="デス数" data-en="Deaths">デス数</label>
        <input type="number" id="deaths" placeholder="0" min="0" step="1" />
      </div>
      <div class="form-group">
        <label class="form-label" for="assists" data-ja="アシスト数" data-en="Assists">アシスト数</label>
        <input type="number" id="assists" placeholder="0" min="0" step="1" />
      </div>
    </div>
    <div style="display:flex;gap:12px;">
      <button id="kdaCalcBtn" class="btn btn-primary" style="flex:2;" data-ja="計算する" data-en="Calculate">計算する</button>

      </div>
      <div class="kda-box">

        <span class="kda-box-value" id="kdValue">—</span>

<script src="../script.js"></script>
<script>
(function() {
  function loadHistory() {
    try { return JSON.parse(localStorage.getItem("kdaHistory") || "[]"); } catch(e) { return []; }
  }
  function saveHistory(h) { localStorage.setItem("kdaHistory", JSON.stringify(h)); }

  function getGrade(kda) {
    if (kda >= 3.0) return { grade: "S", cls: "grade-s", desc: "圧倒的なパフォーマンス。プロレベルの戦績です。" };
    if (kda >= 2.0) return { grade: "A", cls: "grade-a", desc: "優秀な戦績。チームへの貢献度が高いです。" };
    if (kda >= 1.5) return { grade: "B", cls: "grade-b", desc: "平均以上の戦績。安定したプレイができています。" };
    if (kda >= 1.0) return { grade: "C", cls: "grade-c", desc: "平均的な戦績。デスを減らすことを意識しましょう。" };
    return { grade: "D", cls: "grade-d", desc: "改善の余地あり。ポジショニングを見直してみましょう。" };
  }

  function calcKDA(k, d, a) {
    var kda = d === 0 ? (k + a) : (k + a) / d;
    var kd  = d === 0 ? k : k / d;
    return { kda: kda, kd: kd };
  }

  function renderHistory() {
    var history = loadHistory();
    var el = document.getElementById("kdaHistory");
    var avgRow = document.getElementById("kdaAvgRow");
    if (history.length === 0) {
      el.innerHTML = '<p style="color:var(--text-dim);font-size:0.88rem;text-align:center;padding:16px;">履歴がありません。「履歴に追加」で記録できます。</p>';
      avgRow.style.display = "none";
      return;
    }
    avgRow.style.display = "flex";
    var totalKda = history.reduce(function(s, m) { return s + m.kda; }, 0);
    document.getElementById("kdaAvgValue").textContent = (totalKda / history.length).toFixed(2);

    el.innerHTML = history.map(function(m, i) {
      var g = getGrade(m.kda);
      return '<div class="match-row">' +
        '<span style="color:var(--text-muted);font-size:0.78rem;">#' + (history.length - i) + '</span>' +
        '<span>' + m.k + '/' + m.d + '/' + m.a + '</span>' +
        '<span class="match-row-kda">KDA ' + m.kda.toFixed(2) + '</span>' +
        '<span class="badge badge-' + (g.grade === 'S' ? 'orange' : g.grade === 'A' ? 'red' : g.grade === 'B' ? 'purple' : 'gray') + '">' + g.grade + '</span>' +
        '<span style="color:var(--text-dim);font-size:0.75rem;">' + m.date + '</span>' +
        '<button class="match-row-del" data-index="' + i + '">✕</button>' +
        '</div>';
    }).join('');

    el.querySelectorAll(".match-row-del").forEach(function(btn) {
      btn.addEventListener("click", function() {
        var h = loadHistory(); h.splice(parseInt(this.dataset.index), 1); saveHistory(h); renderHistory();
      });
    });
  }

  var lastResult = null;

  document.getElementById("kdaCalcBtn").addEventListener("click", function() {
    var k = parseInt(document.getElementById("kills").value)   || 0;
    var d = parseInt(document.getElementById("deaths").value)  || 0;
    var a = parseInt(document.getElementById("assists").value) || 0;
    var r = calcKDA(k, d, a);
    var g = getGrade(r.kda);
    lastResult = { k: k, d: d, a: a, kda: r.kda, kd: r.kd };

    document.getElementById("kdaValue").textContent = r.kda.toFixed(2);
    document.getElementById("kdValue").textContent  = r.kd.toFixed(2);
    document.getElementById("kdaGradeSmall").textContent = g.grade;
    var gradeEl = document.getElementById("kdaGrade");
    gradeEl.textContent = g.grade;
    gradeEl.className = "kda-grade " + g.cls;
    document.getElementById("kdaGradeDesc").textContent = g.desc;
    document.getElementById("kdaResult").style.display = "block";
    document.getElementById("kdaResult").scrollIntoView({ behavior: "smooth" });
  });

  document.getElementById("kdaSaveBtn").addEventListener("click", function() {
    if (!lastResult) { alert("先に計算を実行してください。"); return; }
    var h = loadHistory();
    var now = new Date();
    h.unshift({
      k: lastResult.k, d: lastResult.d, a: lastResult.a,
      kda: lastResult.kda, kd: lastResult.kd,
      date: now.getMonth()+1 + "/" + now.getDate() + " " + now.getHours() + ":" + ("0"+now.getMinutes()).slice(-2)
    });
    saveHistory(h); renderHistory();
  });

  document.getElementById("kdaClearBtn").addEventListener("click", function() {
    if (confirm("履歴をすべて削除しますか？")) { saveHistory([]); renderHistory(); }
  });

  renderHistory();
})();
</script>
</body>
